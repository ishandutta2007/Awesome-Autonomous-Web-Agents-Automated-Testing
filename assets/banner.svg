inite}.node-float{animation:float 6s ease-in-out infinite alternate}.node-float-reverse{animation:floatReverse 7s ease-in-out infinite alternate}</style></defs><rect width="1200" height="280" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="280" fill="url(#grid)" rx="16"/><circle cx="250" cy="90" r="220" fill="url(#meshOrb1)" class="pulse-circle"/><circle cx="950" cy="180" r="260" fill="url(#meshOrb2)" class="pulse-circle"/><g opacity=".35"><path fill="none" stroke="#6366f1" stroke-width="2" d="M -50 220 Q 300 40 600 180 T 1250 80" class="dash-flow"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 100 Q 400 260 800 100 T 1250 240" class="dash-flow" style="animation-direction:reverse"/></g><g class="node-float" opacity=".45"><circle cx="100" cy="80" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><circle cx="100" cy="80" r="6" fill="#38bdf8" filter="url(#softGlow)"/><text x="100" y="115" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BROWSER</text></g><g class="node-float-reverse" opacity=".45"><circle cx="1100" cy="190" r="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/><circle cx="1100" cy="190" r="6" fill="#c084fc" filter="url(#softGlow)"/><text x="1100" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TEST RUNNER</text></g><rect width="840" height="210" x="180" y="35" fill="#0b0f19" fill-opacity=".75" stroke="#374151" stroke-opacity=".4" stroke-width="1" rx="14"/><g transform="translate(600, 68)"><rect width="280" height="28" x="-140" y="-14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" rx="14"/><circle cx="-118" cy="0" r="4.5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="10" y="5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSyste