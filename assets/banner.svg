<svg width="100%" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="meshOrb1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshOrb2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#374151" fill-opacity="0.7" />
    </pattern>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 8;
        animation: flow 20s linear infinite;
      }
      .node-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      .node-float-reverse {
        animation: floatReverse 7s ease-in-out infinite alternate;
      }
      @keyframes flow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.98); }
        100% { opacity: 0.55; transform: scale(1.02); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (in background) -->
  <circle cx="250" cy="90" r="220" fill="url(#meshOrb1)" class="pulse-circle" />
  <circle cx="950" cy="180" r="260" fill="url(#meshOrb2)" class="pulse-circle" />

  <!-- Dynamic Geometric Flows in Background -->
  <g opacity="0.35">
    <path d="M -50 220 Q 300 40 600 180 T 1250 80" fill="none" stroke="#6366f1" stroke-width="2" class="dash-flow" />
    <path d="M -50 100 Q 400 260 800 100 T 1250 240" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow" style="animation-direction: reverse;" />
  </g>

  <!-- Dynamic Decorative Nodes on the Sides (low opacity to not conflict with text) -->
  <g class="node-float" opacity="0.45">
    <circle cx="100" cy="80" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="100" cy="80" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="100" y="115" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">BROWSER</text>
  </g>

  <g class="node-float-reverse" opacity="0.45">
    <circle cx="1100" cy="190" r="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="1100" cy="190" r="6" fill="#c084fc" filter="url(#softGlow)" />
    <text x="1100" y="225" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TEST RUNNER</text>
  </g>

  <!-- High-Contrast Foreground Content (Title, Subtitle, Tags) -->
  <!-- Subtle backplate for pristine legibility -->
  <rect x="180" y="35" width="840" height="210" rx="14" fill="#0b0f19" fill-opacity="0.75" stroke="#374151" stroke-width="1" stroke-opacity="0.4" />

  <!-- Badge / Pill Above Title -->
  <g transform="translate(600, 68)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="-118" cy="0" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">CURATED TESTING &amp; AGENTS ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="132" text-anchor="middle" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Awesome Autonomous Web Agents
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="165" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
    &amp; Automated Testing Infrastructure
  </text>

  <!-- Tagline / Pills Row -->
  <g transform="translate(600, 208)">
    <!-- Pill 1 -->
    <rect x="-330" y="-13" width="130" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.8" />
    <text x="-265" y="4" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">⚡ AI Web Agents</text>

    <!-- Pill 2 -->
    <rect x="-185" y="-13" width="160" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.8" />
    <text x="-105" y="4" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">🤖 Self-Healing E2E</text>

    <!-- Pill 3 -->
    <rect x="-10" y="-13" width="170" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.8" />
    <text x="75" y="4" text-anchor="middle" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">🌐 Cloud Headless Grids</text>

    <!-- Pill 4 -->
    <rect x="175" y="-13" width="155" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="0.8" stroke-opacity="0.8" />
    <text x="252" y="4" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">🎯 Playwright &amp; VLM</text>
  </g>
</svg>
